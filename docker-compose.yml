# ============================================================================
# docker-compose.yml — Nandhini Tex production deployment
# ============================================================================
# Quickstart (SQLite, single-instance):
#   1. Copy .env.production.example to .env and fill in real secrets:
#        cp .env.production.example .env
#        # Edit .env: set ADMIN_PASSWORD (min 12 chars) + ADMIN_SESSION_SECRET
#
#   2. Build + start:
#        docker compose up -d --build
#
#   3. Initialize the database (first run only — the SQLite db ships in the
#      image, but if you want to reseed or use a fresh volume):
#        docker compose run --rm web bun run db:push
#        docker compose run --rm web bun run db:seed-full
#
#   4. Tail logs:
#        docker compose logs -f
#
#   5. Stop:
#        docker compose down
#
# For PostgreSQL, swap the DATABASE_URL + add a `db` service (see commented section).
# ============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nandhini-tex:latest
    container_name: nandhini-tex
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Override env_file values for the container runtime
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      # Persist the SQLite database across container restarts.
      # The container writes to /app/db/custom.db — mount a host directory
      # here so data survives `docker compose down`.
      - ./db:/app/db
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health?check=liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        # Cap logs at 30MB (3 files × 10MB) to prevent disk fill
        max-size: "10m"
        max-file: "3"
    # Security: read-only root filesystem (the app only writes to /app/db,
    # which is a separate volume, and /tmp which Next.js may use for image cache)
    read_only: false  # set to true and add tmpfs: [/tmp, /app/.next/cache] if hardening
    # tmpfs:
    #   - /tmp:size=64m
    #   - /app/.next/cache:size=64m
    # Resource limits (uncomment + tune for your host)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 512M
    #     reservations:
    #       memory: 128M

# ============================================================================
